name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go vet ./...
      - run: go build -trimpath -o dist/m4s-converter-bv.exe .
      - shell: pwsh
        run: |
          Copy-Item scripts/select-bv.cmd dist/
          Copy-Item README-BV.md,LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath m4s-converter-bv-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: m4s-converter-bv-windows-amd64
          path: m4s-converter-bv-windows-amd64.zip
